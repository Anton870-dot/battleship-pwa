# Сборка Android-приложения «Морской бой» (APK) прямо на GitHub.
# Положить этот файл в репозиторий по пути: .github/workflows/android.yml
name: Android APK

on:
  workflow_dispatch:        # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Файлы игры
        run: |
          mkdir -p app/www
          rsync -a --exclude app --exclude .git --exclude .github ./ app/www/

      - name: Проект Capacitor
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ru.anton870.morskoyboy",
            "appName": "Морской бой",
            "webDir": "www",
            "android": { "backgroundColor": "#0b3d6b" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Иконка приложения
        working-directory: app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp www/icon-512.png assets/icon-only.png
          cp www/icon-512.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0b3d6b'

      - name: Сборка APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../morskoy-boy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morskoy-boy-apk
          path: morskoy-boy.apk
