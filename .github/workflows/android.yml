# Сборка Android-приложения «Морской бой» (APK) прямо на GitHub.
# Положить этот файл в репозиторий по пути: .github/workflows/android.yml
name: Android APK

on:
  workflow_dispatch:        # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK на сервере GitHub уже установлен — отдельно ставить не нужно
      - name: Файлы игры
        run: |
          mkdir -p app/www
          rsync -a --exclude app --exclude .git --exclude .github ./ app/www/

      - name: Проект Capacitor
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ru.anton870.morskoyboy",
            "appName": "Морской бой",
            "webDir": "www",
            "android": { "backgroundColor": "#0b3d6b" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Иконка приложения
        working-directory: app/android/app/src/main/res
        run: |
          if command -v convert >/dev/null; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; px=${d##*:}
              convert ../../../../../www/icon-512.png -resize ${px}x${px} mipmap-$n/ic_launcher.png
              cp mipmap-$n/ic_launcher.png mipmap-$n/ic_launcher_round.png
            done
            rm -rf mipmap-anydpi-v26
          fi

      - name: Сборка APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ../../morskoy-boy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morskoy-boy-apk
          path: morskoy-boy.apk
